name: Project checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Verify portfolio pages and mobile navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              page = browser.new_page(viewport={"width": 390, "height": 844})
              errors = []
              page.on("pageerror", lambda error: errors.append(str(error)))
              page.route("https://fonts.googleapis.com/**", lambda route: route.abort())
              page.goto(Path("index.html").resolve().as_uri())
              page.locator("#preloader").wait_for(state="hidden")
              assert page.locator(".profile-img").evaluate("(image) => image.naturalWidth > 0")
              assert Path("resume.pdf").read_bytes().startswith(b"%PDF")
              menu = page.get_by_role("button", name="Navigation menu")
              menu.focus()
              page.keyboard.press("Enter")
              assert menu.get_attribute("aria-expanded") == "true"
              page.keyboard.press("Escape")
              assert menu.get_attribute("aria-expanded") == "false"
              assert menu.evaluate("(button) => document.activeElement === button")
              menu.click()
              page.get_by_role("navigation").get_by_role("link", name="Projects").click()
              assert page.evaluate("location.hash") == "#projects"
              assert menu.get_attribute("aria-expanded") == "false"
              page.goto(Path("privacy.html").resolve().as_uri())
              assert "Privacy Policy" in page.title()
              assert not errors, errors
          PY
